name: Build and deploy

# The site is built now, so Pages cannot just serve the branch. This builds with
# Astro and publishes dist/.
#
# Pages must be set to "GitHub Actions" as its source for this to work. An
# earlier workflow here failed on every run because Pages was set to branch
# deploys while the workflow expected Actions mode — the two are mutually
# exclusive, and the mismatch is silent apart from the failure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The episode data is committed, so a deploy does not depend on the feed
      # being reachable — refreshing it is the separate scheduled workflow's job.
      - run: npx astro build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
