name: Refresh episodes from RSS

# The feed changes whenever Christian and Lauren publish; the site is static, so
# something has to go and look. This runs on a schedule, rebuilds the episode
# list and the mirrored feed, and commits only when the output actually changed.
#
# It does NOT deploy. It commits the refreshed data, and that push triggers
# deploy.yml, which builds and publishes. Keeping the two separate means a feed
# outage cannot break a deploy, and a deploy does not depend on the feed.

on:
  schedule:
    - cron: '17 5,17 * * *'      # twice a day, offset off the hour
  workflow_dispatch:              # and on demand, for when they publish and want it now

permissions:
  contents: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet Pillow

      - name: Refresh episode data from the feed
        run: python3 tools/build-episodes.py

      - name: Commit only if something changed
        run: |
          if git diff --quiet; then
            echo "feed unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/episodes.json public/feed.xml public/assets/episodes
          git commit -m "Refresh episodes from RSS"
          git push
